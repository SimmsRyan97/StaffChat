# StaffChat configuration

chat:
  # Prefix players type at the start of a message to route it to staff chat.
  prefix: "@"

  # If true, players without `staffchat.send` can still send prefix-based messages,
  # but only users with `staffchat.receive` will see them.
  allow-public-sending: true

style:
  # Supports legacy '&' colors (example: &a, &6, &7)
  # and hex colors in formats: #55FFAA, &#55FFAA, <#55FFAA>.
  plugin-prefix: "&a[Staff Chat]"

  # Available placeholders: %prefix%, %sender%, %message%
  message-format: "%prefix% &7%sender% &8> &f%message%"

messages:
  no-permission: "&cYou do not have permission to do that."
  reloaded: "&aStaffChat configuration reloaded."
  help-header: "&6StaffChat"
  help-reload: "&7/sc reload &8- &fReload configuration"

discord:
  # Enable forwarding of prefixed in-game staff messages to Discord.
  enabled: false

  # AUTO, DISCORDSRV, ESSENTIALS
  provider: "AUTO"

  # Recommended: set channel-id for DiscordSRV relay.
  # You can also use channel-name as fallback.
  channel-id: ""
  channel-name: "staff-chat"

  # Placeholders: %sender%, %message%, %channel_id%, %channel_name%
  message-format: "[StaffChat] %sender%: %message%"

  # Used only when provider is ESSENTIALS.
  # This is dispatched as console command with placeholder replacement.
  # Example (replace with command supported by your Essentials Discord bridge):
  # essentials-relay-command: "essentialsdiscord send %channel_name% %message%"
  essentials-relay-command: ""
