# StaffChat configuration

chat:
  # Prefix players type at the start of a message to route it to staff chat.
  prefix: "@"

  # If true, players without `staffchat.send` can still send prefix-based messages,
  # but only users with `staffchat.receive` will see them.
  allow-public-sending: true

style:
  # Supports legacy '&' colors (example: &a, &6, &7)
  # and hex colors in formats: #55FFAA, &#55FFAA, <#55FFAA>.
  plugin-prefix: "&a[Staff Chat]"

  # Available placeholders: %prefix%, %sender%, %message%
  message-format: "%prefix% &7%sender% &8> &f%message%"

messages:
  no-permission: "&cYou do not have permission to do that."
  reloaded: "&aStaffChat configuration reloaded."
  help-header: "&6StaffChat"
  help-reload: "&7/sc reload &8- &fReload configuration"

discord:
  # Enable forwarding of prefixed in-game staff messages to Discord.
  enabled: true

  # Which provider to use: AUTO, DISCORDSRV, ESSENTIALS
  # AUTO tries DiscordSRV first, then EssentialsXDiscord as fallback.
  provider: "AUTO"

  # The Discord channel ID to send messages to.
  # Right-click the channel in Discord (with Developer Mode on) and copy the ID.
  # StaffChat treats this as the source of truth and binds DiscordSRV runtime routing
  # automatically, so you do not need to predefine this private channel in DiscordSRV Channels.
  # Optional for DiscordSRV: explicit runtime game key used internally by StaffChat.
  channel-key: ""
  channel-id: ""
  channel-name: "staff-chat"

  outbound:
    # Relay in-game prefixed staff messages to Discord.
    enabled: true

    # Uses the provider's own Minecraft -> Discord formatting:
    # - DiscordSRV: messages.yml (MinecraftChatToDiscordMessageFormat)
    # - EssentialsDiscord: built-in player chat format
    # StaffChat only prepends its prefix to the message body.

  inbound:
    # Relay messages from the configured Discord staff channel back to in-game
    # staff chat (players with `staffchat.receive`).
    enabled: true

    # Reuse the provider's own Discord -> Minecraft format (DiscordSRV messages.yml
    # or Essentials Discord relay format) and only prepend StaffChat's prefix.
    add-prefix: true
